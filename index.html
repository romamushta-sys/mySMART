<script>
const $=s=>document.querySelector(s);
const CATS={money:'💰 Деньги',weight:'⚖️ Вес и здоровье',study:'📚 Учёба',books:'📖 Книги',buy:'🛒 Покупки',other:'🎯 Другое'};
let goals=[],store=null,sample=null,editId=null,aiText={},pendingDel=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n.toFixed(1)).toLocaleString('ru-RU');
const today=()=>new Date().toISOString().slice(0,10);
const setSync=t=>$('#sync').textContent=t;

function entries(g){if(g.mode==='items')return (g.items||[]).filter(i=>i.done&&i.at).map(i=>i.at).sort().map((d,k)=>({d,v:k+1}));return (g.entries||[]).slice().sort((a,b)=>a.d.localeCompare(b.d))}
function cur(g){const e=entries(g);return e.length?e[e.length-1].v:g.start}
function pct(g){const t=g.target-g.start;if(!t)return 100;return Math.max(0,Math.min(100,(cur(g)-g.start)/t*100))}
function daysLeft(g){return Math.ceil((new Date(g.deadline+'T23:59:59')-Date.now())/864e5)}
function status(g){
  const p=pct(g);if(p>=100)return{k:'done',t:'Цель достигнута 🎉'};
  const s=new Date(g.created).getTime(),e=new Date(g.deadline+'T23:59:59').getTime(),n=Date.now();
  if(n>e)return{k:'bad',t:'Срок истёк'};
  const tp=Math.max(0,Math.min(1,(n-s)/(e-s)))*100,d=p-tp;
  if(d>=5)return{k:'ok',t:'Опережаете график'};
  if(d>-10)return{k:'ok',t:'По графику'};
  return{k:'warn',t:'Отстаёте от графика'};
}
function tips(g){
  const st=status(g),out=[],rem=g.target-cur(g),dl=daysLeft(g),e=entries(g);
  if(st.k==='done')return['Отметьте успех и поставьте следующую цель — чуть амбициознее.'];
  if(dl>0){const w=Math.max(dl/7,1/7),per=Math.abs(rem)/w;out.push(`До срока ${dl} дн. Нужный темп: ${fmt(per)} ${esc(g.unit)} в неделю.`);
    if(g.cat==='weight'&&/кг|kg/i.test(g.unit)&&per>1)out.push('Темп выше ~1 кг в неделю — это тяжело и рискованно для здоровья. Лучше сдвиньте срок.');}
  const last=e.length?Math.floor((Date.now()-new Date(e[e.length-1].d))/864e5):Math.floor((Date.now()-new Date(g.created))/864e5);
  if(last>=7)out.push(`Последняя отметка была ${last} дн. назад. Внесите актуальное значение — без этого трекинг не работает.`);
  if(st.k==='warn'||st.k==='bad')out.push('Разбейте цель на недельные мини-шаги или честно пересмотрите срок. Лучше скорректировать план, чем бросить цель.');
  if(st.k==='ok')out.push('Хороший ход. Закрепите привычку: выберите фиксированный день недели для отметки.');
  if(g.cat==='money')out.push('Для денег лучше всего работает автоперевод в день дохода — до того, как деньги потратятся.');
  if(g.cat==='weight')out.push('Следите за трендом за 2–3 недели, а не за ежедневными колебаниями.');
  const f=forecast(g);
  if(f&&pct(g)<100){out.unshift(f.never?'По текущему тренду цель не приближается: динамика идёт в другую сторону.':f.date.getFullYear()>new Date().getFullYear()+5?'При текущем темпе цель достигнется нескоро: нужно ускориться.':`Прогноз по тренду: цель около ${f.date.toLocaleDateString('ru-RU')} (${f.diff>3?`на ${Math.round(f.diff)} дн. позже срока`:f.diff<-3?`на ${Math.round(-f.diff)} дн. раньше срока`:'примерно в срок'}).`)}
  {const p0=pct(g),q=[.25,.5,.75].find(q=>p0<q*100-0.01);if(q&&p0<100){const t0=new Date(g.created.slice(0,10)).getTime(),t1=new Date(g.deadline+'T00:00:00').getTime();out.push(`Ближайшая веха (${q*100}%): ${fmt(g.start+(g.target-g.start)*q)} ${esc(g.unit)} к ${new Date(t0+(t1-t0)*q).toLocaleDateString('ru-RU')}.`)}}
  out.push(...moneyTip(g));
  return out.concat(subTips(g));
}
function spark(g){
  const pts=[{d:g.created.slice(0,10),v:g.start},...entries(g)];
  if(pts.length<2)return'';
  const t=x=>new Date(x).getTime(),t0=t(pts[0].d),t1=Math.max(t(pts[pts.length-1].d),t0+864e5);
  const vs=pts.map(p=>p.v).concat(g.target),mn=Math.min(...vs),mx=Math.max(...vs),r=(mx-mn)||1;
  const xy=p=>`${4+(t(p.d)-t0)/(t1-t0)*292},${40-(p.v-mn)/r*36}`;
  const ty=40-(g.target-mn)/r*36;
  return `<svg viewBox="0 0 300 44" preserveAspectRatio="none"><line x1="0" x2="300" y1="${ty}" y2="${ty}" stroke="var(--mut)" stroke-dasharray="3 3"/><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map(xy).join(' ')}"/></svg>`;
}
function chart(g){
  const W=480,H=180,L=44,R=14,T=18,B=24,e=entries(g),day=x=>new Date(String(x).slice(0,10)).getTime();
  const t0=day(g.created),t1=Math.max(day(g.deadline),t0+864e5),nw=Date.now();
  const vs=[g.start,g.target,...e.map(p=>p.v)],lo=Math.min(...vs),hi=Math.max(...vs),pd=(hi-lo)*.12||1,mn=lo-pd,mx=hi+pd;
  const X=t=>L+Math.max(0,Math.min(1,(t-t0)/(t1-t0)))*(W-L-R),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const pts=[{x:X(t0),y:Y(g.start),v:g.start,d:g.created.slice(0,10)},...e.map(p=>({x:X(day(p.d)),y:Y(p.v),v:p.v,d:p.d}))];

function cacheAll(){try{localStorage.setItem('smart_cache_'+uid,JSON.stringify({goals,tasks,lists}))}catch(e){}}
function enqueue(o){setQ([...getQ().filter(x=>x.id!==o.id),o])}
function runOp(o){
  return o.op==='up'?sb.from('goals').upsert({user_id:uid,id:o.id,data:o.row,updated_at:new Date().toISOString()},{onConflict:'user_id,id'}):sb.from('goals').delete().eq('id',o.id);
}
async function doOp(o){
  cacheAll();
  if(!navigator.onLine){enqueue(o);setSync('Офлайн: сохранено на устройстве');return}
  let r;try{r=await runOp(o)}catch(e){r={error:e}}
  if(r.error){if(isNet(r.error)){enqueue(o);setSync('Нет связи: отправлю позже')}else setSync('Ошибка сохранения: '+r.error.message)}
  else setSync('Синхронизировано ✓');
}
const syncRow=row=>doOp({op:'up',id:row.id,row});
const syncDel=id=>doOp({op:'del',id});
async function flushQ(){
  const q=getQ();if(!q.length||!sb||!uid||!navigator.onLine)return;
  const rest=[];
  for(const o of q){let r;try{r=await runOp(o)}catch(e){r={error:e}}if(r.error&&isNet(r.error))rest.push(o)}
  setQ(rest);
}
function loadCache(msg){
  try{const c=JSON.parse(localStorage.getItem('smart_cache_'+uid)||'null');if(c){goals=c.goals||[];tasks=c.tasks||[];lists=c.lists||[]}}catch(e){}
  setSync(msg);render();
}
async function loadAll(){
  try{await flushQ()}catch(e){}
  if(!navigator.onLine){loadCache('Офлайн: данные с устройства');return}
  if(getQ().length){loadCache('Есть неотправленные изменения, повторю позже');return}
  let res;try{res=await sb.from('goals').select('data')}catch(e){res={error:e}}
  if(res.error){loadCache(isNet(res.error)?'Нет связи: данные с устройства':'Ошибка загрузки: '+res.error.message);return}
  const all=(res.data||[]).map(r=>r.data);
  goals=all.filter(x=>x&&x.type!=='task'&&x.type!=='list');tasks=all.filter(x=>x&&x.type==='task');lists=all.filter(x=>x&&x.type==='list');
  cacheAll();setSync('Синхронизировано ✓');render();
  goals.slice().forEach(g=>{const r=rollover(g);if(r)store.save(r)});
}
async function startSynced(session){
  if(uid===session.user.id&&store)return;
  uid=session.user.id;$('#auth').hidden=true;$('#list').hidden=false;
  store={
    save:async g=>{const i=goals.findIndex(x=>x.id===g.id);i<0?goals.push(g):goals[i]=g;render();await syncRow(g)},
    del:async id=>{goals=goals.filter(x=>x.id!==id);render();await syncDel(id)}
  };
  await loadAll();
  sb.channel('goals-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'goals'},()=>loadAll()).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&store)loadAll()});
  window.addEventListener('online',()=>{if(store)loadAll()});
  window.addEventListener('offline',()=>setSync('Офлайн: изменения сохранятся на устройстве'));
}

async function doAuth(kind){
  const email=$('#em').value.trim().toLowerCase(),password=$('#pw').value,m=$('#authm');
  if(!email||password.length<6){authErr(m,'Введите email и пароль не короче 6 символов.');return}
  m.style.color='var(--mut)';m.textContent=kind==='in'?'Входим…':'Регистрируем…';
  try{
    if(kind==='in'){
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){authErr(m,'Ошибка входа: '+error.message);return}
      if(data&&data.session)await startSynced(data.session);
      m.textContent='';
    }else{
      const {data,error}=await sb.auth.signUp({email,password});
      if(error){authErr(m,'Ошибка регистрации: '+error.message);return}
      m.style.color='var(--mut)';
      m.textContent=data.session?'':'Проверьте почту: подтвердите адрес, затем нажмите «Войти».';
      if(data.session)await startSynced(data.session);
    }
  }catch(e){authErr(m,'Не удалось выполнить запрос: '+(e&&e.message||e))}
}

function icsT(d,t){return d.replace(/-/g,'')+'T'+(t||'09:00').replace(':','')+'00'}

function makeICS(list,daily){
  const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SMART goals//RU','CALSCALE:GREGORIAN'];

  list.forEach(t=>ev(t.id,icsT(t.due,t.time),t.t));
  if(daily)ev('daily',icsT(iso(new Date()),daily),'Отметить прогресс по целям','FREQ=DAILY');

}

async function remoteSave(row,key,arr){

}
async function remoteDel(id,key,arr){

}
async function saveL(l){const i=lists.findIndex(x=>x.id===l.id);i<0?lists.push(l):lists[i]=l;render();await remoteSave(l,'smart_lists',lists)}
async function delL(id){lists=lists.filter(x=>x.id!==id);render();await remoteDel(id,'smart_lists',lists)}
async function taskAct(a,b){
  const c=b.closest('.card'),id=b.dataset.t,q=s=>{const e=c&&c.querySelector(s);return e?e.value:''};
  if(a==='tkadd'){
    const t=q('[data-tt]').trim();if(!t)return;
    const list=q('[data-tl]')||c.dataset.list||'Дела',kind=c.dataset.kind||'plan',rec=q('[data-tr]'),due0=q('[data-td]'),due=rec&&!due0?iso(new Date()):due0,pe=c.querySelector('[data-tp]');
    if(list==='Напоминания'&&!due){setSync('Укажите дату напоминания');return}
    await saveT({id:'task_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:'task',t,list,kind,done:false,due,time:q('[data-tm]'),pr:!!(pe&&pe.checked),p:parseFloat(q('[data-tpr]'))||0,rec,created:iso(new Date())});
  }
  else if(a==='tktog'){
    const t=tasks.find(x=>x.id===id);if(!t)return;
    if(!t.done&&t.rec&&t.due){let nd=t.due,n=0;const td=iso(new Date());do{nd=addPeriod(nd,t.rec);n++}while(nd<=td&&n<400);await saveT({...t,due:nd,done:false,count:(t.count||0)+1,last:td});setSync('🔁 Выполнено. Следующий раз: '+nd.slice(8)+'.'+nd.slice(5,7))}
    else await saveT({...t,done:!t.done});
  }
  else if(a==='tkbudget'){const name=c.dataset.list,m=metaOf('shop',name)||{id:'list_shop_'+name.replace(/[^0-9A-Za-zА-Яа-яЁё]/g,'_'),type:'list',name,kind:'shop'};await saveL({...m,budget:parseFloat(q('[data-bg]'))||0})}
  else if(a==='tkdel')await delT(id);
  else if(a==='tkclr'){for(const t of tasks.filter(x=>x.list===c.dataset.list&&kindOf(x)===c.dataset.kind&&x.done))await delT(t.id)}
  else if(a==='tkclrplan'){for(const t of tasks.filter(x=>kindOf(x)==='plan'&&x.done))await delT(t.id)}
  else if(a==='tkreset'){for(const t of tasks.filter(x=>x.list===c.dataset.list&&kindOf(x)==='shop'&&x.done))await saveT({...t,done:false})}
  else if(a==='tkcopy'){
    const txt=c.dataset.list+':\n'+tasks.filter(x=>x.list===c.dataset.list&&kindOf(x)==='shop'&&!x.done).map(x=>'• '+x.t).join('\n');
    try{await navigator.clipboard.writeText(txt);setSync('Список скопирован')}catch(e){setSync('Не удалось скопировать')}
  }
  else if(a==='tklist'){const inp=c.querySelector('[data-nl]'),n=inp.value.trim();if(!n)return;await saveL({id:'list_'+Date.now().toString(36),type:'list',name:n,kind:inp.dataset.k})}
  else if(a==='tkdellist'){
    if(!confirm('Удалить список и все его задачи?'))return;
    const l=lists.find(x=>x.id===b.dataset.id);
    if(l){for(const t of tasks.filter(x=>x.list===l.name&&kindOf(x)===l.kind))await delT(t.id);await delL(l.id)}
  }
  else if(a==='tknotif')await enableNotif();
  else if(a==='tkdaily'){setTS({daily:q('[data-dtime]')});setSync('Ежедневное напоминание сохранено');render()}
  else if(a==='tkics'){
    const list=id?tasks.filter(t=>t.id===id):tasks.filter(t=>!t.done&&t.due),daily=id?null:TS().daily;
    if(!list.length&&!daily){setSync('Нет задач с датой для экспорта');return}
    try{const dl=await claude.use('downloads');await dl.save({filename:id?'reminder.ics':'smart-reminders.ics',data:makeICS(list,daily)})}catch(e){setSync('Не удалось сохранить файл')}
  }
}
function fire(title,body,key){
  let f={};try{f=JSON.parse(localStorage.getItem('smart_fired')||'{}')}catch(e){}
  if(f[key])return;f[key]=1;try{localStorage.setItem('smart_fired',JSON.stringify(f))}catch(e){}
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}
  setSync('🔔 '+title+(body?': '+body:''));
}
function tick(){
  const now=Date.now();
  tasks.filter(t=>!t.done&&t.due&&dueTs(t)<=now&&now-dueTs(t)<864e5).forEach(t=>fire('Задача',t.t,'t'+t.id+t.due+(t.time||'')));
  const d=TS().daily;
  if(d){const n=new Date(),hm=pad2(n.getHours())+':'+pad2(n.getMinutes());if(hm>=d&&pending()>0)fire('Отметьте прогресс по целям','Не заполнено пунктов за сегодня: '+pending(),'d'+iso(n))}
}
const pad2=n=>String(n).padStart(2,'0');
setInterval(tick,30000);
$('#list').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.matches||!e.target.matches('[data-tt],[data-it],[data-nl],[data-qv],[data-tpr]'))return;
  const b=e.target.closest('.card').querySelector("[data-act='tkadd'],[data-act='itadd'],[data-act='tklist'],[data-act='qkgen']");
  if(b){e.preventDefault();b.click()}
});
{const h=location.hash.slice(1);if(['today','week','arch','shop','plan','rem'].includes(h))mode=h}
const isAdd=g=>g.inc?g.inc==='add':g.cat==='money';
function addAt(g,d,v){
  const S=entries(g),prev=S.filter(x=>x.d<=d).pop(),base=prev?prev.v:g.start;
  return S.filter(x=>x.d!==d).map(x=>x.d>d?{...x,v:x.v+v}:x).concat({d,v:base+v}).sort((a,b)=>a.d.localeCompare(b.d));
}
function entryText(g,p){
  if(!isAdd(g))return `${fmt(p.v)} ${esc(g.unit)}`;
  const S=entries(g),k=S.indexOf(p),prev=k>0?S[k-1].v:g.start,dl=p.v-prev;
  return `${dl>=0?'+':'−'}${fmt(Math.abs(dl))} ${esc(g.unit)} · всего ${fmt(p.v)}`;
}
function parseChips(t){
  return (t||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split('='),v=parseFloat((p.length>1?p[1]:p[0]).replace(',','.'));return isNaN(v)?null:{l:p.length>1?p[0].trim():'',v}}).filter(Boolean);
}
const chipsText=g=>((g&&g.chips)||[]).map(c=>(c.l?c.l+'=':'')+c.v).join(', ');
function chipsOf(g){
  if(Array.isArray(g.chips))return g.chips;
  if(g.cat==='money')return [{l:'',v:1000},{l:'',v:5000},{l:'',v:10000}];
  if(/^мл$/i.test(g.unit||''))return [{l:'Стакан',v:250},{l:'',v:500}];
  return [];
}
function chipsInner(g){
  if(g.archived)return'';
  if(g.mode==='items'){const nx=(g.items||[]).find(i=>!i.done);return `<button class='p' data-act='qkbook' data-g='${esc(g.id)}'>${g.cat==='books'?'📖 Прочитана':'✓ Выполнено'}${nx?': '+esc(nx.t):''}</button>`}
  if(!isAdd(g))return'';
  return chipsOf(g).map((c,i)=>`<button class='p' data-act='qkadd' data-i='${i}' data-g='${esc(g.id)}'>${c.l?esc(c.l)+' ':''}+${fmt(c.v)} ${esc(g.unit)}</button>`).join('');
}
function chipsHTML(g){const h=chipsInner(g);return h?`<div class='ci' style='margin:10px 0 0'>${h}</div>`:''}
function quickPanel(){
  const act=goals.filter(g=>!g.archived);
  const rows=act.map(g=>{const h=chipsInner(g);return h?`<div class='row2' style='align-items:center'><div style='min-width:110px'><b style="font:600 15px Onest,sans-serif">${esc(g.title)}</b></div><div class='ci' style='margin:0'>${h}</div></div>`:''}).join('');
  const add=act.filter(g=>isAdd(g)&&g.mode!=='items');
  const form=add.length?`<div class='ci'><select data-qg style='width:auto;max-width:220px'>${add.map(g=>`<option value='${esc(g.id)}'>${esc(g.title)}</option>`).join('')}</select><input type='number' step='any' data-qv placeholder='Сумма или количество' style='width:170px'><button class='p' data-act='qkgen'>Добавить</button></div>`:'';
  if(!rows&&!form)return'';
  return `<div class='card'><div class='bd'><b>⚡ Быстрое добавление</b></div>${rows}${form}</div>`;
}
async function quickAct(a,b,g){
  const d=iso(new Date()),c=b.closest('.card');let ng=null;
  g=g||goals.find(x=>x.id===b.dataset.g);
  if(a==='qkgen'){
    const gg=goals.find(x=>x.id===c.querySelector('[data-qg]').value),inp=c.querySelector('[data-qv]'),v=parseFloat(inp.value);
    if(!gg||isNaN(v))return;ng={...gg,entries:addAt(gg,d,v)};inp.value='';
  }else if(!g)return;
  else if(a==='qkadd'){const ch=chipsOf(g)[+b.dataset.i];if(!ch)return;ng={...g,entries:addAt(g,d,ch.v)}}
  else if(a==='qkbook'){
    const it=(g.items||[]).slice(),k=it.findIndex(i=>!i.done);
    if(k>=0)it[k]={...it[k],done:true,at:d};
    else it.push({id:'i'+Date.now().toString(36)+it.length,t:(g.cat==='books'?'Книга ':'Пункт ')+(it.length+1),p:0,done:true,at:d});
    ng={...g,items:it};
  }
  if(!ng)return;
  await store.save(ng);
  setSync('✓ '+ng.title+': '+fmt(cur(ng))+' '+ng.unit+' из '+fmt(ng.target));
}
const metaOf=(kind,name)=>lists.find(x=>x.kind===kind&&x.name===name);
let recovering=false;
function showRecovery(){showAuth('Задайте новый пароль');$('#authform').hidden=true;$('#recov').hidden=false}
$('#forgot').onclick=async()=>{
  const email=$('#em').value.trim().toLowerCase(),m=$('#authm');
  if(!email){authErr(m,'Введите email: на него придёт ссылка для смены пароля.');return}
  m.style.color='var(--mut)';m.textContent='Отправляем…';
  try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)authErr(m,'Ошибка: '+error.message);else{m.style.color='var(--mut)';m.textContent='Письмо со ссылкой отправлено. Откройте ссылку на этом устройстве.'}
  }catch(e){authErr(m,'Не удалось отправить: '+(e&&e.message||e))}
};
$('#npb').onclick=async()=>{
  const p=$('#np').value,m=$('#authm');
  if(p.length<6){authErr(m,'Пароль не короче 6 символов.');return}
  try{
    const {error}=await sb.auth.updateUser({password:p});
    if(error){authErr(m,'Ошибка: '+error.message);return}
    recovering=false;try{history.replaceState(null,'',location.pathname)}catch(e){}
    $('#recov').hidden=true;$('#authform').hidden=false;m.textContent='';
    const {data}=await sb.auth.getSession();if(data.session)await startSynced(data.session);
  }catch(e){authErr(m,String(e&&e.message||e))}
};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
$('#inst').onclick=()=>{
  $('#mn').hidden=true;
  if(deferredInstall){deferredInstall.prompt();deferredInstall=null;return}
  alert('Как установить приложение:\n• iPhone (Safari): кнопка «Поделиться» → «На экран Домой».\n• Android (Chrome): меню ⋮ → «Установить приложение».\n• Компьютер (Chrome или Edge): значок установки в адресной строке.');

async function init(){
  render();
  if(!window.supabase||SUPABASE_URL.indexOf('ВСТАВЬТЕ')===0){startLocal('Только на этом устройстве: не настроен Supabase');return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;showRecovery();return}
    if(sess&&!recovering)startSynced(sess);
    else if(ev==='SIGNED_OUT'){goals=[];tasks=[];lists=[];store=null;uid=null;render();showAuth('')}
  });
  const {data}=await sb.auth.getSession();
  if(recovering)showRecovery();else if(data.session)startSynced(data.session);else showAuth('');
}
init();
