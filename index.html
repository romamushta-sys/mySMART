<script>
const $=s=>document.querySelector(s);
const CATS={money:'💰 Деньги',weight:'⚖️ Вес и здоровье',study:'📚 Учёба',books:'📖 Книги',buy:'🛒 Покупки',other:'🎯 Другое'};
let goals=[],store=null,sample=null,editId=null,aiText={},pendingDel=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n.toFixed(1)).toLocaleString('ru-RU');
const today=()=>new Date().toISOString().slice(0,10);
const setSync=t=>$('#sync').textContent=t;

function srcEntries(g){
  const sg=goals.find(x=>x.id===g.src.g);if(!sg)return[];
  const d0=g.created.slice(0,10),ex=(g.history||[]).length>0,inC=d=>g.repeat==='day'?d===g.deadline:((ex?d>d0:d>=d0)&&d<=g.deadline),by={};
  (sg.logs||[]).forEach(l=>{if(l.s===g.src.s&&inC(l.d))by[l.d]=(by[l.d]||0)+l.v});
  let c=0;return Object.keys(by).sort().map(d=>{c+=by[d];return{d,v:c}});
}
function entries(g){if(g.src)return srcEntries(g);if(g.mode==='items')return (g.items||[]).filter(i=>i.done&&i.at).map(i=>i.at).sort().map((d,k)=>({d,v:k+1}));return (g.entries||[]).slice().sort((a,b)=>a.d.localeCompare(b.d))}
function cur(g){const e=entries(g);return e.length?e[e.length-1].v:g.start}
function pct(g){const t=g.target-g.start;if(!t)return 100;return Math.max(0,Math.min(100,(cur(g)-g.start)/t*100))}
function daysLeft(g){return Math.ceil((new Date(g.deadline+'T23:59:59')-Date.now())/864e5)}
function status(g){
  const p=pct(g);if(p>=100)return{k:'done',t:'Цель достигнута 🎉'};
  const s=new Date(g.created).getTime(),e=new Date(g.deadline+'T23:59:59').getTime(),n=Date.now();
  if(n>e)return{k:'bad',t:'Срок истёк'};
  const tp=Math.max(0,Math.min(1,(n-s)/(e-s)))*100,d=p-tp;
  if(d>=5)return{k:'ok',t:'Опережаете график'};
  if(d>-10)return{k:'ok',t:'По графику'};
  return{k:'warn',t:'Отстаёте от графика'};
}
function tips(g){
  const st=status(g),out=[],rem=g.target-cur(g),dl=daysLeft(g),e=entries(g);
  if(st.k==='done')return['Отметьте успех и поставьте следующую цель — чуть амбициознее.'];
  if(isShort(g))return [`Осталось ${fmt(Math.max(0,rem))} ${esc(g.unit)} до конца периода.`].concat(subTips(g));
  if(dl>0){const w=Math.max(dl/7,1/7),per=Math.abs(rem)/w;out.push(`До срока ${dl} дн. Нужный темп: ${fmt(per)} ${esc(g.unit)} в неделю.`);
    if(g.cat==='weight'&&/кг|kg/i.test(g.unit)&&per>1)out.push('Темп выше ~1 кг в неделю — это тяжело и рискованно для здоровья. Лучше сдвиньте срок.');}
  const last=e.length?Math.floor((Date.now()-new Date(e[e.length-1].d))/864e5):Math.floor((Date.now()-new Date(g.created))/864e5);
  if(last>=7)out.push(`Последняя отметка была ${last} дн. назад. Внесите актуальное значение — без этого трекинг не работает.`);
  if(st.k==='warn'||st.k==='bad')out.push('Разбейте цель на недельные мини-шаги или честно пересмотрите срок. Лучше скорректировать план, чем бросить цель.');
  if(st.k==='ok')out.push('Хороший ход. Закрепите привычку: выберите фиксированный день недели для отметки.');
  if(g.cat==='money')out.push('Для денег лучше всего работает автоперевод в день дохода — до того, как деньги потратятся.');
  if(g.cat==='weight')out.push('Следите за трендом за 2–3 недели, а не за ежедневными колебаниями.');
  const f=forecast(g);
  if(f&&pct(g)<100){out.unshift(f.never?'По текущему тренду цель не приближается: динамика идёт в другую сторону.':f.date.getFullYear()>new Date().getFullYear()+5?'При текущем темпе цель достигнется нескоро: нужно ускориться.':`Прогноз по тренду: цель около ${f.date.toLocaleDateString('ru-RU')} (${f.diff>3?`на ${Math.round(f.diff)} дн. позже срока`:f.diff<-3?`на ${Math.round(-f.diff)} дн. раньше срока`:'примерно в срок'}).`)}
  {const p0=pct(g),q=[.25,.5,.75].find(q=>p0<q*100-0.01);if(q&&p0<100){const t0=new Date(g.created.slice(0,10)).getTime(),t1=new Date(g.deadline+'T00:00:00').getTime();out.push(`Ближайшая веха (${q*100}%): ${fmt(g.start+(g.target-g.start)*q)} ${esc(g.unit)} к ${new Date(t0+(t1-t0)*q).toLocaleDateString('ru-RU')}.`)}}
  out.push(...moneyTip(g));
  {const tt=trendTip(g);if(tt)out.unshift(tt)}
  return out.concat(subTips(g));
}
function spark(g){

function forecast(g){
  const E=entries(g);if(E.length<3)return null;
  const d0=new Date(g.created.slice(0,10)).getTime(),P=[[0,g.start],...E.map(p=>[(new Date(p.d)-d0)/864e5,p.v])],n=P.length;
  const sx=P.reduce((a,p)=>a+p[0],0),sy=P.reduce((a,p)=>a+p[1],0),sxx=P.reduce((a,p)=>a+p[0]*p[0],0),sxy=P.reduce((a,p)=>a+p[0]*p[1],0),den=n*sxx-sx*sx;
  if(!den||P[n-1][0]<3)return null;
  const k=(n*sxy-sx*sy)/den,b=(sy-k*sx)/n;
  if(k*(g.target-g.start)<=0)return{k,b,d0,never:true};
  const date=new Date(d0+((g.target-b)/k)*864e5);
  if(!isFinite(date.getTime()))return{k,b,d0,never:true};
  return{k,b,d0,date,diff:(date-new Date(g.deadline+'T00:00:00'))/864e5};
}

}

const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],ICSD=['MO','TU','WE','TH','FR','SA','SU'];
const DRE=[/(^|[^а-я])(пн|пон)/,/(^|[^а-я])(вт|вто)/,/(^|[^а-я])(ср|сре)/,/(^|[^а-я])(чт|чет)/,/(^|[^а-я])(пт|пят)/,/(^|[^а-я])(сб|суб)/,/(^|[^а-я])(вс|вос)/];
function schedOf(s){
  const t=String(s.days||'').toLowerCase().replace(/ё/g,'е'),days=[];
  DRE.forEach((re,i)=>{if(re.test(t))days.push(i)});
  const m=t.match(/(\d{1,2})[:.](\d{2})/);
  return{days,time:m?pad2(+m[1])+':'+m[2]:''};
}
function plannedDates(s){
  const sc=schedOf(s);if(!sc.days.length)return[];
  const wk=weekDays(),mv=s.mv||{},out=[];
  wk.forEach((d,i)=>{if(sc.days.includes(i)&&!mv[d])out.push(d)});
  Object.keys(mv).forEach(k=>{if(wk.includes(mv[k]))out.push(mv[k])});
  return [...new Set(out)].sort();
}

}

const tourState={list:[],members:{},scores:{},err:null,loaded:false,loading:false,joinCode:''};
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return iso(x)};
function pctAt(g,d){
  const E=entries(g).filter(p=>p.d<=d),v=E.length?E[E.length-1].v:g.start,tt=g.target-g.start;
  if(!tt)return 100;return Math.max(0,Math.min(100,(v-g.start)/tt*100));
}
function tournScore(t){
  const s=t.start_date,td=iso(new Date()),e=t.end_date>td?td:t.end_date,prev=addDays(s,-1);
  let prog=0,done=0,cyc=0;const days=new Set();
  goals.forEach(g=>{
    entries(g).forEach(p=>{if(p.d>=s&&p.d<=e)days.add(p.d)});
    (g.logs||[]).forEach(l=>{if(l.d>=s&&l.d<=e)days.add(l.d)});
    if(g.repeat){
      const h=(g.history||[]).filter(x=>x.to>=s&&x.to<=e&&x.p>=100).length+((!g.archived&&pct(g)>=100&&td>=s&&td<=t.end_date)?1:0);
      cyc+=h*(g.repeat==='day'?5:10);return;
    }
    const a=pctAt(g,prev),b=pctAt(g,e);prog+=Math.max(0,b-a);if(a<100&&b>=100)done++;
  });
  const tk=tasks.filter(x=>x.done&&x.doneAt>=s&&x.doneAt<=e).length;
  const details={prog:Math.round(prog),days:days.size,done,cyc,tasks:tk};
  return{points:Math.round(prog+3*days.size+25*done+cyc+tk),details};
}

    tourState.joinCode='';tourState.loaded=false;await loadTour();setSync('🏆 Вы в турнире «'+((r.data&&r.data.name)||'')+'»');return;
  }
  if(a==='trcopy'){
    const t=tourState.list.find(x=>x.id===id);if(!t)return;
    const link=location.origin+location.pathname+'?join='+t.code;
    const txt='Присоединяйся к турниру «'+t.name+'» ('+t.start_date+' — '+t.end_date+'). Код: '+t.code+'. Ссылка: '+link;
    try{await navigator.clipboard.writeText(txt);setSync('Приглашение скопировано')}catch(e){setSync('Код турнира: '+t.code)}
    return;
  }
  if(a==='trleave'){
    if(!confirm('Выйти из турнира?'))return;
    await sb.from('tournament_scores').delete().eq('tournament_id',id).eq('user_id',uid);
    const r=await sb.from('tournament_members').delete().eq('tournament_id',id).eq('user_id',uid);
    if(r.error){setSync('Ошибка: '+r.error.message);return}
    tourState.loaded=false;await loadTour();return;
  }
  if(a==='trdel'){
    if(!confirm('Удалить турнир у всех участников?'))return;
    const r=await sb.from('tournaments').delete().eq('id',id);
    if(r.error){setSync('Ошибка: '+r.error.message);return}
    tourState.loaded=false;await loadTour();
  }
}
$('#trb').onclick=()=>{tourState.loaded=false;setMode('tour')};
{const jp=new URLSearchParams(location.search||'').get('join');if(jp){tourState.joinCode=jp.toUpperCase();mode='tour'}}
async function init(){
  render();
  const last=(()=>{try{return localStorage.getItem('smart_last_uid')}catch(e){return null}})();
  window.addEventListener('online',onOnline);
  window.addEventListener('offline',()=>setSync('Офлайн: изменения сохранятся на устройстве'));
  if(!window.supabase||SUPABASE_URL.indexOf('ВСТАВЬТЕ')===0){
    if(last&&hasCache(last)&&SUPABASE_URL.indexOf('ВСТАВЬТЕ')!==0){startCached(last,'Нет связи с сервером: показаны сохранённые данные');return}
    startLocal('Только на этом устройстве: не настроен Supabase');return;
  }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;showRecovery();return}
    if(sess&&!recovering)startSynced(sess);
    else if(ev==='SIGNED_OUT'){if(!navigator.onLine)return;goals=[];tasks=[];lists=[];store=null;uid=null;render();showAuth('')}
  });
  let data=null;try{data=(await sb.auth.getSession()).data}catch(e){}
  if(recovering)showRecovery();
  else if(data&&data.session)startSynced(data.session);
  else if(last&&hasCache(last)&&!navigator.onLine)startCached(last,'Офлайн: данные с устройства');
  else showAuth('');
}
init();
</script></body></html>
